[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
clear_env = no

; Must stay in sync with request_body max_size in docker/production/Caddyfile.
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size] = 100M

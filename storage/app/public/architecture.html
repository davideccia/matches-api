<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ground:   #111118;
  --ground-2: #1A1A24;
  --ground-3: #23232F;
  --text:     #EAE6DE;
  --mid:      #8A8A9E;
  --border:   #2A2A3A;
  --accent:   #D44444;
  --mono:     'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, 'Courier New', monospace;
  --serif:    Georgia, 'Times New Roman', serif;
  --sans:     -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;

  --l-entry:       #D44444;
  --l-domain:      #E07838;
  --l-data:        #4AAD78;
  --l-async:       #4A8CC4;
  --l-integration: #9B7BD4;
  --l-infra:       #72727E;
}

html, body { height: 100%; background: var(--ground); }
body {
  font-family: var(--sans);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ─────────────────────────────────────────── */
.top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1.5rem;
  flex-wrap: wrap;
  padding: 1.1rem 1.4rem 0.9rem;
  border-bottom: 1px solid var(--border);
  flex: none;
}
.eyebrow {
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 0.3rem;
}
h1 { font-family: var(--serif); font-size: 1.55rem; font-weight: normal; line-height: 1.1; }
h1 em { font-style: normal; color: var(--accent); }

.legend { display: flex; flex-wrap: wrap; gap: 0.55rem 1rem; }
.legend span {
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--mid);
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}
.legend i { width: 9px; height: 9px; border-radius: 2px; display: block; }

/* ── Shell ──────────────────────────────────────────── */
.shell { flex: 1; display: flex; min-height: 0; }

/* ── Diagram ────────────────────────────────────────── */
.stage { position: relative; flex: 1; min-width: 0; overflow: hidden; }
#svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#svg.dragging { cursor: grabbing; }

.edge { fill: none; stroke: #33334A; stroke-width: 1.1; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
.edge.incident { stroke: #6E6E90; stroke-width: 1.7; }
.edge.flow { stroke: #EAE6DE; stroke-width: 2; }
.dim { opacity: 0.09; }

.node rect {
  fill: var(--ground-2);
  stroke: var(--border);
  stroke-width: 1;
  rx: 3;
}
.node.hot rect { fill: var(--ground-3); }
.node .accentbar { stroke: none; rx: 0; }
.node text {
  font-family: var(--mono);
  font-size: 11px;
  fill: var(--text);
  dominant-baseline: middle;
  pointer-events: none;
}
.node .sub {
  font-size: 8.5px;
  fill: var(--mid);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.node { cursor: pointer; }
.node.flowlit rect { stroke: var(--text); stroke-width: 1.6; }

.flowseq { fill: none; stroke: #EAE6DE; stroke-width: 2.2; stroke-dasharray: 7 5; }
.stepbadge circle { fill: #EAE6DE; stroke: var(--ground); stroke-width: 1.5; }
.stepbadge text { font-family: var(--mono); font-size: 9.5px; fill: #111118; font-weight: 600; text-anchor: middle; dominant-baseline: central; }

.edgelabel {
  font-family: var(--mono);
  font-size: 10px;
  fill: var(--text);
  text-anchor: middle;
  pointer-events: none;
}
.edgelabel-bg { fill: var(--ground); stroke: var(--border); rx: 2; }

/* ── Controls ───────────────────────────────────────── */
.controls {
  position: absolute;
  left: 0.9rem;
  bottom: 0.9rem;
  display: flex;
  gap: 0.4rem;
}
.controls button {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--mid);
  background: var(--ground-2);
  border: 1px solid var(--border);
  padding: 0.35rem 0.6rem;
  cursor: pointer;
}
.controls button:hover { color: var(--text); border-color: var(--mid); }

.hint {
  position: absolute;
  right: 0.9rem;
  bottom: 0.9rem;
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.06em;
  color: var(--mid);
  opacity: 0.7;
  pointer-events: none;
}

/* ── Tooltip ────────────────────────────────────────── */
#tip {
  position: fixed;
  z-index: 20;
  max-width: 330px;
  background: var(--ground-3);
  border: 1px solid var(--border);
  border-left: 3px solid var(--mid);
  padding: 0.65rem 0.8rem;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.1s;
  box-shadow: 0 8px 26px rgba(0,0,0,0.55);
}
#tip.on { opacity: 1; }
#tip .t-name { font-family: var(--serif); font-size: 0.98rem; line-height: 1.2; }
#tip .t-meta {
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--mid);
  margin: 0.2rem 0 0.45rem;
}
#tip .t-path {
  font-family: var(--mono);
  font-size: 0.66rem;
  color: var(--mid);
  word-break: break-all;
  margin-bottom: 0.4rem;
}
#tip .t-desc { font-size: 0.8rem; line-height: 1.55; }

/* ── Panel ──────────────────────────────────────────── */
.panel {
  flex: none;
  width: 330px;
  border-left: 1px solid var(--border);
  background: var(--ground-2);
  overflow-y: auto;
  padding: 1rem 1.1rem 2.5rem;
}
.panel-label {
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--mid);
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0.9rem;
}
.flow {
  border: 1px solid var(--border);
  background: var(--ground);
  padding: 0.7rem 0.8rem;
  margin-bottom: 0.55rem;
  cursor: pointer;
}
.flow:hover { border-color: var(--mid); }
.flow.active { border-color: var(--accent); border-left-width: 3px; }
.flow-name { font-family: var(--serif); font-size: 1rem; line-height: 1.2; }
.flow-desc { font-size: 0.78rem; color: var(--mid); line-height: 1.5; margin-top: 0.3rem; overflow-wrap: anywhere; }

.steps { list-style: none; margin: 0.7rem 0 0.2rem; }
.steps li {
  display: grid;
  grid-template-columns: 22px 1fr;
  gap: 0.55rem;
  align-items: baseline;
  padding: 0.3rem 0;
  border-top: 1px solid var(--border);
  cursor: pointer;
}
.steps li:hover .s-name { color: #fff; text-decoration: underline; }
.s-num { font-family: var(--mono); font-size: 0.62rem; color: var(--mid); }
.s-name { font-family: var(--mono); font-size: 0.73rem; line-height: 1.4; }
.s-layer {
  font-family: var(--mono);
  font-size: 0.55rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  display: block;
  color: var(--mid);
}
.clearflow {
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--mid);
  background: none;
  border: 1px solid var(--border);
  padding: 0.3rem 0.55rem;
  cursor: pointer;
  margin-bottom: 0.9rem;
}
.clearflow:hover { color: var(--text); border-color: var(--mid); }

.panel-foot {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--mid);
  line-height: 1.7;
  margin-top: 1.4rem;
  padding-top: 0.8rem;
  border-top: 1px solid var(--border);
}

/* ── Responsive ─────────────────────────────────────── */
@media (max-width: 900px) {
  body { overflow: auto; }
  .shell { flex-direction: column; }
  .stage { height: 62vh; flex: none; }
  .panel { width: auto; border-left: none; border-top: 1px solid var(--border); overflow: visible; }
  .legend { display: none; }
}

const LAYERS = ['entry', 'domain', 'data', 'async', 'integration', 'infra'];
const LAYER_LABEL = {
  entry: 'entry · http',
  domain: 'domain · logic',
  data: 'data · models',
  async: 'async · queue',
  integration: 'integration',
  infra: 'infra'
};
const layerColor = l => getComputedStyle(document.documentElement).getPropertyValue('--l-' + l).trim() || '#8A8A9E';

/* ── Layout: one band per layer, wrapped into sub-columns ── */
const NW = 196, NH = 42, VGAP = 14, COLGAP = 34, BANDGAP = 78, MAXROWS = 14, TOP = 54;

const byId = new Map(GRAPH.nodes.map(n => [n.id, n]));
let x = 0;
const bands = [];

LAYERS.forEach(layer => {
  const list = GRAPH.nodes.filter(n => n.layer === layer);
  if (!list.length) { return; }
  const cols = Math.ceil(list.length / MAXROWS);
  const rows = Math.ceil(list.length / cols);
  list.forEach((n, i) => {
    const c = Math.floor(i / rows), r = i % rows;
    n.x = x + c * (NW + COLGAP);
    n.y = TOP + r * (NH + VGAP);
    n.w = NW;
    n.h = NH;
  });
  const width = cols * NW + (cols - 1) * COLGAP;
  bands.push({ layer, x, width });
  x += width + BANDGAP;
});

/* ── Render ── */
const svg = document.getElementById('svg');
const gEdges = document.getElementById('edges');
const gNodes = document.getElementById('nodes');
const gLabels = document.getElementById('labels');
const gFlow = document.getElementById('flowlayer');
const viewport = document.getElementById('viewport');
const tip = document.getElementById('tip');
const NS = 'http://www.w3.org/2000/svg';
const el = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) { e.setAttribute(k, a[k]); } return e; };

bands.forEach(b => {
  const t = el('text', { x: b.x, y: 26, class: 'edgelabel' });
  t.style.textAnchor = 'start';
  t.setAttribute('fill', layerColor(b.layer));
  t.style.letterSpacing = '0.12em';
  t.style.textTransform = 'uppercase';
  t.style.fontSize = '10px';
  t.textContent = LAYER_LABEL[b.layer];
  gLabels.appendChild(t);
});

function anchors(a, b) {
  const forward = b.x >= a.x;
  const sx = forward ? a.x + a.w : a.x;
  const tx = forward ? b.x : b.x + b.w;
  return { sx, sy: a.y + a.h / 2, tx, ty: b.y + b.h / 2, forward };
}
function edgePath(a, b) {
  const { sx, sy, tx, ty, forward } = anchors(a, b);
  const d = Math.max(40, Math.abs(tx - sx) * 0.45);
  const c1 = forward ? sx + d : sx - d;
  const c2 = forward ? tx - d : tx + d;
  return `M ${sx} ${sy} C ${c1} ${sy}, ${c2} ${ty}, ${tx} ${ty}`;
}

const edgeEls = [];
GRAPH.edges.forEach((e, i) => {
  const a = byId.get(e.from), b = byId.get(e.to);
  const d = edgePath(a, b);
  const p = el('path', { d, class: 'edge', 'marker-end': 'url(#arrow)' });
  const hit = el('path', { d, class: 'edge-hit' });
  gEdges.appendChild(p);
  gEdges.appendChild(hit);
  const rec = { e, p, hit, a, b, i };
  edgeEls.push(rec);
  hit.addEventListener('mouseenter', ev => showEdgeTip(rec, ev));
  hit.addEventListener('mousemove', ev => place(ev.clientX, ev.clientY));
  hit.addEventListener('mouseleave', hideTip);
});

const nodeEls = new Map();
GRAPH.nodes.forEach(n => {
  const g = el('g', { class: 'node', transform: `translate(${n.x},${n.y})` });
  g.appendChild(el('rect', { width: n.w, height: n.h }));
  g.appendChild(el('rect', { width: 3, height: n.h, class: 'accentbar', fill: layerColor(n.layer) }));
  const label = el('text', { x: 12, y: n.h / 2 - 5 });
  label.textContent = n.label.length > 26 ? n.label.slice(0, 25) + '…' : n.label;
  const sub = el('text', { x: 12, y: n.h / 2 + 9, class: 'sub' });
  sub.textContent = n.type;
  g.appendChild(label);
  g.appendChild(sub);
  gNodes.appendChild(g);
  nodeEls.set(n.id, g);

  const enter = ev => { showNodeTip(n, ev); highlightNode(n.id, true); };
  g.addEventListener('mouseenter', enter);
  g.addEventListener('mousemove', ev => place(ev.clientX, ev.clientY));
  g.addEventListener('mouseleave', () => { hideTip(); highlightNode(n.id, false); });
  g.addEventListener('click', ev => { ev.stopPropagation(); showNodeTip(n, ev); place(ev.clientX, ev.clientY); });
});

/* ── Tooltip ── */
function showNodeTip(n, ev) {
  tip.style.borderLeftColor = layerColor(n.layer);
  tip.innerHTML = '<div class="t-name"></div><div class="t-meta"></div><div class="t-path"></div><div class="t-desc"></div>';
  tip.querySelector('.t-name').textContent = n.label;
  tip.querySelector('.t-meta').textContent = n.type + ' · ' + n.layer;
  tip.querySelector('.t-path').textContent = n.path;
  tip.querySelector('.t-desc').textContent = n.description;
  tip.classList.add('on');
  place(ev.clientX, ev.clientY);
}
function showEdgeTip(rec, ev) {
  tip.style.borderLeftColor = '#6E6E90';
  tip.innerHTML = '<div class="t-name"></div><div class="t-meta"></div><div class="t-desc"></div>';
  tip.querySelector('.t-name').textContent = rec.a.label + ' → ' + rec.b.label;
  tip.querySelector('.t-meta').textContent = rec.e.type;
  tip.querySelector('.t-desc').textContent = rec.e.label || '';
  tip.classList.add('on');
  place(ev.clientX, ev.clientY);
}
function hideTip() { tip.classList.remove('on'); }
function place(cx, cy) {
  const r = tip.getBoundingClientRect();
  let left = cx + 16, top = cy + 16;
  if (left + r.width > window.innerWidth - 8) { left = cx - r.width - 16; }
  if (top + r.height > window.innerHeight - 8) { top = cy - r.height - 16; }
  tip.style.left = Math.max(8, left) + 'px';
  tip.style.top = Math.max(8, top) + 'px';
}

function highlightNode(id, on) {
  if (activeFlow) { return; }
  nodeEls.get(id).classList.toggle('hot', on);
  edgeEls.forEach(r => {
    if (r.e.from === id || r.e.to === id) { r.p.classList.toggle('incident', on); }
  });
}

/* ── Flows ── */
let activeFlow = null;
const flowsBox = document.getElementById('flows');

GRAPH.flows.forEach(f => {
  const card = document.createElement('div');
  card.className = 'flow';
  card.dataset.id = f.id;
  const nm = document.createElement('div'); nm.className = 'flow-name'; nm.textContent = f.name;
  const ds = document.createElement('div'); ds.className = 'flow-desc'; ds.textContent = f.description;
  card.appendChild(nm); card.appendChild(ds);
  card.addEventListener('click', () => selectFlow(activeFlow === f.id ? null : f.id));
  flowsBox.appendChild(card);
});

function selectFlow(id) {
  activeFlow = id;
  gFlow.innerHTML = '';
  document.querySelectorAll('.steps').forEach(s => s.remove());
  document.querySelectorAll('.flow').forEach(c => c.classList.toggle('active', c.dataset.id === id));
  nodeEls.forEach(g => { g.classList.remove('dim', 'flowlit', 'hot'); });
  edgeEls.forEach(r => { r.p.classList.remove('dim', 'flow', 'incident'); });

  if (!id) { return; }
  const flow = GRAPH.flows.find(f => f.id === id);
  const set = new Set(flow.steps);

  nodeEls.forEach((g, nid) => { g.classList.toggle('dim', !set.has(nid)); g.classList.toggle('flowlit', set.has(nid)); });

  const pairs = new Set();
  for (let i = 0; i < flow.steps.length - 1; i++) { pairs.add(flow.steps[i] + '>' + flow.steps[i + 1]); }
  edgeEls.forEach(r => {
    const onPath = pairs.has(r.e.from + '>' + r.e.to) || pairs.has(r.e.to + '>' + r.e.from);
    r.p.classList.toggle('flow', onPath);
    r.p.classList.toggle('dim', !onPath);
  });

  for (let i = 0; i < flow.steps.length - 1; i++) {
    const a = byId.get(flow.steps[i]), b = byId.get(flow.steps[i + 1]);
    gFlow.appendChild(el('path', { d: edgePath(a, b), class: 'flowseq', 'marker-end': 'url(#arrow-flow)' }));
  }
  flow.steps.forEach((sid, i) => {
    const n = byId.get(sid);
    const g = el('g', { class: 'stepbadge', transform: `translate(${n.x - 2},${n.y - 2})` });
    g.appendChild(el('circle', { r: 9 }));
    const t = el('text', {}); t.textContent = i + 1;
    g.appendChild(t);
    gFlow.appendChild(g);
  });

  const card = document.querySelector(`.flow[data-id="${id}"]`);
  const ol = document.createElement('ol');
  ol.className = 'steps';
  flow.steps.forEach((sid, i) => {
    const n = byId.get(sid);
    const li = document.createElement('li');
    const num = document.createElement('span'); num.className = 's-num'; num.textContent = String(i + 1).padStart(2, '0');
    const wrap = document.createElement('span');
    const nm = document.createElement('span'); nm.className = 's-name'; nm.textContent = n.label;
    const ly = document.createElement('span'); ly.className = 's-layer'; ly.textContent = n.type + ' · ' + n.layer;
    ly.style.color = layerColor(n.layer);
    wrap.appendChild(nm); wrap.appendChild(ly);
    li.appendChild(num); li.appendChild(wrap);
    li.addEventListener('click', ev => { ev.stopPropagation(); centerOn(n); });
    ol.appendChild(li);
  });
  card.appendChild(ol);
  fitTo(flow.steps.map(s => byId.get(s)));
}
document.getElementById('clear').addEventListener('click', () => selectFlow(null));

/* ── Pan & zoom ── */
let scale = 1, tx = 0, ty = 0;
const apply = () => viewport.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);

function bounds(list) {
  const ns = list || GRAPH.nodes;
  return {
    x0: Math.min(...ns.map(n => n.x)) - 40,
    y0: Math.min(...ns.map(n => n.y)) - 60,
    x1: Math.max(...ns.map(n => n.x + n.w)) + 40,
    y1: Math.max(...ns.map(n => n.y + n.h)) + 40
  };
}
function fitTo(list) {
  const b = bounds(list);
  const r = svg.getBoundingClientRect();
  scale = Math.min(r.width / (b.x1 - b.x0), r.height / (b.y1 - b.y0), 1.6);
  tx = (r.width - (b.x1 - b.x0) * scale) / 2 - b.x0 * scale;
  ty = (r.height - (b.y1 - b.y0) * scale) / 2 - b.y0 * scale;
  apply();
}
function centerOn(n) {
  const r = svg.getBoundingClientRect();
  scale = Math.max(scale, 0.9);
  tx = r.width / 2 - (n.x + n.w / 2) * scale;
  ty = r.height / 2 - (n.y + n.h / 2) * scale;
  apply();
}
function zoomAt(cx, cy, factor) {
  const r = svg.getBoundingClientRect();
  const px = cx - r.left, py = cy - r.top;
  const next = Math.min(3, Math.max(0.15, scale * factor));
  tx = px - (px - tx) * (next / scale);
  ty = py - (py - ty) * (next / scale);
  scale = next;
  apply();
}

svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  zoomAt(ev.clientX, ev.clientY, ev.deltaY < 0 ? 1.12 : 1 / 1.12);
}, { passive: false });

let dragging = false, lastX = 0, lastY = 0;
svg.addEventListener('pointerdown', ev => {
  dragging = true; lastX = ev.clientX; lastY = ev.clientY;
  svg.classList.add('dragging');
  svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener('pointermove', ev => {
  if (!dragging) { return; }
  tx += ev.clientX - lastX; ty += ev.clientY - lastY;
  lastX = ev.clientX; lastY = ev.clientY;
  apply();
});
const endDrag = () => { dragging = false; svg.classList.remove('dragging'); };
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('pointerleave', endDrag);

document.getElementById('zin').addEventListener('click', () => {
  const r = svg.getBoundingClientRect();
  zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.25);
});
document.getElementById('zout').addEventListener('click', () => {
  const r = svg.getBoundingClientRect();
  zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.25);
});
document.getElementById('fit').addEventListener('click', () => fitTo(null));

/* ── Legend & footer ── */
const legend = document.getElementById('legend');
bands.forEach(b => {
  const s = document.createElement('span');
  const i = document.createElement('i');
  i.style.background = layerColor(b.layer);
  s.appendChild(i);
  s.appendChild(document.createTextNode(LAYER_LABEL[b.layer]));
  legend.appendChild(s);
});
document.getElementById('foot').textContent =
  GRAPH.nodes.length + ' nodi · ' + GRAPH.edges.length + ' relazioni · ' + GRAPH.flows.length + ' flussi — grafo generato da ' + GRAPH.generated_from + '. Stesso grafo disponibile come architecture.json per consumo da parte di agenti.';

function refit() {
  const flow = activeFlow && GRAPH.flows.find(f => f.id === activeFlow);
  fitTo(flow ? flow.steps.map(s => byId.get(s)) : null);
}
window.addEventListener('resize', refit);
requestAnimationFrame(refit);
window.addEventListener('load', refit);
</script>

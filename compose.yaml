services:
    laravel.test:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${FORWARD_REVERB_PORT:-8080}:8080'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
            - mailpit
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    # Production image, built from docker/production/Dockerfile. Opt-in only:
    # it sits behind the "production" profile so `sail up` / `docker compose up`
    # never starts it alongside laravel.test. Launch it explicitly instead:
    #   docker compose --profile production up --build production
    # It reuses the same pgsql/redis containers as Sail (different DB/Redis
    # index, see below) so there is nothing extra to provision.
    production:
        profiles:
            - production
        build:
            context: .
            dockerfile: docker/production/Dockerfile
        image: matches-api/production
        ports:
            - '${PROD_APP_PORT:-8090}:80'
            - '${PROD_REVERB_PORT:-8091}:8080'
            - '127.0.0.1:${PROD_ADMIN_PORT:-8092}:8081'
        volumes:
            - ./docker/production/volumes/storage/:/var/www/storage
        environment:
            APP_NAME: '${APP_NAME:-Laravel}'
            APP_ENV: production
            APP_KEY: '${APP_KEY}'
            APP_DEBUG: 'false'
            APP_URL: 'http://localhost:${PROD_APP_PORT:-8090}'
            LOG_CHANNEL: daily
            DB_CONNECTION: pgsql
            DB_HOST: pgsql
            DB_PORT: 5432
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD:-secret}'
            # Different indexes than Sail's default (0), so cache/session/queue
            # data and Horizon's job list don't collide between the two stacks.
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_DB: '${PROD_REDIS_DB:-4}'
            REDIS_CACHE_DB: '${PROD_REDIS_CACHE_DB:-5}'
            REDIS_PREFIX: 'matches_production-database-'
            HORIZON_PREFIX: 'matches_production_horizon:'
            LARAVEL_PDF_DRIVER: dompdf
            RUN_MIGRATIONS: '${PROD_RUN_MIGRATIONS:-true}'
            HORIZON_USERNAME: '${PROD_HORIZON_USERNAME:-admin}'
            HORIZON_PASSWORD: '${PROD_HORIZON_PASSWORD:-admin}'
            LOG_VIEWER_USERNAME: '${PROD_LOG_VIEWER_USERNAME:-admin}'
            LOG_VIEWER_PASSWORD: '${PROD_LOG_VIEWER_PASSWORD:-admin}'
            PULSE_USERNAME: '${PROD_PULSE_USERNAME:-admin}'
            PULSE_PASSWORD: '${PROD_PULSE_PASSWORD:-admin}'
            BACKUP_DISK: '${BACKUP_DISK:-local-backup}'
            BACKUP_AWS_ACCESS_KEY_ID: '${BACKUP_AWS_ACCESS_KEY_ID}'
            BACKUP_AWS_SECRET_ACCESS_KEY: '${BACKUP_AWS_SECRET_ACCESS_KEY}'
            BACKUP_AWS_DEFAULT_REGION: '${BACKUP_AWS_DEFAULT_REGION}'
            BACKUP_AWS_BUCKET: '${BACKUP_AWS_BUCKET}'
            BACKUP_AWS_URL: '${BACKUP_AWS_URL}'
            BACKUP_AWS_ENDPOINT: '${BACKUP_AWS_ENDPOINT}'
            BACKUP_AWS_USE_PATH_STYLE_ENDPOINT: '${BACKUP_AWS_USE_PATH_STYLE_ENDPOINT}'
            BACKUP_ARCHIVE_PASSWORD: '${BACKUP_ARCHIVE_PASSWORD}'
            BACKUP_NOTIFICATION_EMAIL: '${BACKUP_NOTIFICATION_EMAIL}'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local

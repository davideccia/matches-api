# Full nginx configuration (replaces /etc/nginx/nginx.conf).
#
# TLS is terminated OUTSIDE this container by a reverse proxy (nginx proxy
# manager, Caddy, ...), so nginx here only ever speaks plain HTTP:
#
#   api.<domain>     -> container:80    this server block -> php-fpm
#   reverb.<domain>  -> container:8080  Reverb directly, not proxied here
#
# Routing by hostname happens in the external proxy, which is why there is no
# server_name here and therefore no envsubst templating in the entrypoint.

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    keepalive_timeout 65;

    server_tokens off;

    # Must stay in sync with upload_max_filesize / post_max_size in php-fpm.conf.
    client_max_body_size 100M;

    # Container logs go to the docker log driver. Laravel's own application log
    # is a separate concern: it writes daily files under storage/logs so that
    # /log-viewer has something to read.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.api+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        root /var/www/public;
        index index.php;

        charset utf-8;

        # The reverse proxy in front terminates TLS; without this Laravel would
        # generate http:// URLs and see the proxy's IP as the client.
        # trustProxies(at: '*') is already set in bootstrap/app.php.

        # /up (health), /horizon, /log-viewer and /api/* all resolve through the
        # front controller — no dedicated location blocks needed.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_hide_header X-Powered-By;

            # DOMPDF rendering of a large tournament sheet can outlast the
            # default 60s.
            fastcgi_read_timeout 120s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Block dotfiles, but keep /.well-known reachable for the proxy in front.
        location ^~ /.well-known/ {
            allow all;
        }

        location ~ /\. {
            deny all;
        }
    }
}

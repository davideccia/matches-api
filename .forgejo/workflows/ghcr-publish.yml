# ==============================================================================
# Build dell'immagine di produzione e push su GitHub Container Registry (ghcr.io).
#
# Trigger: pubblicazione di una release (non piu' ogni push su main). L'immagine
# viene taggata `latest` + titolo della release.
#
# Il job `tests` gira per primo: `build-push` ha `needs: tests`, quindi
# nessuna immagine viene pubblicata se la suite PHPUnit fallisce.
#
# Runner: label `docker-29-cli` → il job gira in un'immagine docker:29-cli
# (CLI + buildx, daemon raggiunto via socket dell'host). Nessuna node action
# oltre a checkout, così il workflow non dipende da mirror di docker/*-action.
#
# Variables (pannello Forgejo): GHCR_USERNAME
# Secrets: GHCR_TOKEN (PAT con scope write:packages)
#
# A differenza della dashboard, qui NON ci sono build-arg: l'immagine non
# incorpora nessuna configurazione. APP_KEY, DB_*, REDIS_*, REVERB_*,
# HORIZON_*/LOG_VIEWER_* vanno iniettate come environment variable al deploy,
# quindi la stessa immagine vale per tutti gli ambienti.
# ==============================================================================
name: GHCR publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # Gate: l'immagine non viene costruita se la suite non passa.
  # Nessun servizio esterno: la configurazione arriva da .env.testing
  # (versionato) copiato in .env, e il database e' SQLite su file.
  tests:
    runs-on: docker-29-cli
    container:
      image: php:8.5-cli
    steps:
      # checkout@v6 e' una node action: il runner la lancia con `node` dentro
      # questo container, che e' debian-slim e non ha ne' git ne' node.
      - name: Install checkout deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git nodejs unzip libzip-dev libpng-dev libjpeg62-turbo-dev libfreetype6-dev

      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6

      # pdo_sqlite/sqlite3 sono gia' attive in php:8.5-cli. Mancano quelle
      # richieste da composer.json: zip, pcntl (horizon), exif (medialibrary)
      # e gd, usata da UploadedFile::fake()->image() nei test.
      - name: Install PHP extensions
        run: |
          docker-php-ext-configure gd --with-jpeg --with-freetype
          docker-php-ext-install -j"$(nproc)" zip pcntl exif gd

      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer --version

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.testing .env
          touch database/testing.sqlite

      - name: Run tests
        run: php artisan test --compact

  build-push:
    needs: tests
    runs-on: docker-29-cli
    steps:
      # docker:29-cli è alpine e non ha né git né node: checkout@v6 è una node
      # action, il runner la lancia con `node` dentro questo container.
      - name: Install checkout deps
        run: apk add --no-cache git nodejs

      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6

      # Preflight: fallisce subito e in chiaro se il daemon non è raggiungibile.
      - name: Check Docker daemon
        run: docker version

      # ghcr.io accetta solo path minuscoli, la variabile può non esserlo.
      # RELEASE_TAG: titolo della release, normalizzato ai caratteri ammessi in
      # un tag Docker ([A-Za-z0-9_.-], max 128). Fallback: tag_name, poi il ref.
      - name: Resolve image and tag
        run: |
          echo "IMAGE=ghcr.io/$(echo "${{ vars.GHCR_USERNAME }}" | tr '[:upper:]' '[:lower:]')/matches-api" >> "$GITHUB_ENV"
          RAW="${{ github.event.release.name || github.event.release.tag_name || github.ref_name }}"
          RELEASE_TAG=$(echo "$RAW" | sed 's/[^A-Za-z0-9_.-]/-/g' | cut -c1-128)
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ vars.GHCR_USERNAME }}" --password-stdin

      # buildx (non `docker build`): il Dockerfile usa `# syntax=` e BuildKit
      # legge docker/production/Dockerfile.dockerignore per filtrare il context.
      # Il context è la ROOT del repo (serve composer.json).
      - name: Build and push
        run: |
          docker buildx build \
            -f docker/production/Dockerfile \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$RELEASE_TAG" \
            --push \
            .

      - name: Logout
        if: always()
        run: docker logout ghcr.io

# Location comuni ai due server block di nginx.conf (incluso da entrambi).
#
# Vive in un file separato perche' la porta pubblica :80 e la porta admin :8081
# servono la STESSA applicazione: l'unica differenza sono i quattro `return 404`
# che :80 aggiunge sopra questo include. Duplicare le location significherebbe
# che una divergenza silenziosa fra le due copie diventa un buco.
#
# Contesto: server. Non includere altrove.

root /var/www/public;
index index.php;

charset utf-8;

# Il reverse proxy davanti termina il TLS; trustProxies(at: '*') e' gia'
# impostato in bootstrap/app.php.

# /up (health), /horizon, /log-viewer e /api/* risolvono tutti attraverso il
# front controller — nessuna location dedicata necessaria.
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ \.php$ {
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_hide_header X-Powered-By;

    # bootstrap/app.php ha trustProxies(at: '*'), quindi Symfony ignora la porta
    # dell'header Host e la prende da X-Forwarded-Host/Port: senza quegli header
    # `asset()` genera URL senza porta. Sulla :80 il proxy davanti li manda e
    # $forwarded_host resta vuoto (`if_not_empty` salta il param e passa quelli
    # del client); sulla porta admin non c'e' nessun proxy, quindi e' nginx a
    # dichiarare l'host reale del browser. Vedi nginx.conf.
    fastcgi_param HTTP_X_FORWARDED_HOST $forwarded_host if_not_empty;

    # Il rendering DOMPDF di una scheda torneo grande puo' superare i 60s di
    # default.
    fastcgi_read_timeout 120s;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

# Blocca i dotfile, ma tiene /.well-known raggiungibile per il proxy davanti.
location ^~ /.well-known/ {
    allow all;
}

location ~ /\. {
    deny all;
}

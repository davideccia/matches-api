# Full nginx configuration (replaces /etc/nginx/nginx.conf).
#
# TLS is terminated OUTSIDE this container by a reverse proxy (nginx proxy
# manager, Caddy, ...), so nginx here only ever speaks plain HTTP.
#
# Three porte, due delle quali NON vanno pubblicate su internet:
#
#   api.<domain>     -> container:80    pubblica, API. /horizon, /log-viewer e
#                                       /pulse qui rispondono 404: si
#                                       raggiungono solo dalla porta admin.
#   reverb.<domain>  -> container:8080  pubblica, Reverb (non proxiata qui)
#   -                -> container:8081  ADMIN. Stessa app, senza i 404. Va
#                                       pubblicata SOLO su loopback
#                                       (127.0.0.1:8081:8081) e raggiunta con un
#                                       LocalForward SSH. Vedi README.md §9.
#
# Routing by hostname happens in the external proxy, which is why there is no
# server_name here and therefore no envsubst templating in the entrypoint.

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    keepalive_timeout 65;

    server_tokens off;

    # Must stay in sync with upload_max_filesize / post_max_size in php-fpm.conf.
    client_max_body_size 100M;

    # Container logs go to the docker log driver. Laravel's own application log
    # is a separate concern: it writes daily files under storage/logs so that
    # /log-viewer has something to read.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.api+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ─── Pubblico: dietro il reverse proxy ────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        # Il reverse proxy davanti manda i suoi X-Forwarded-*: non sovrascriverli.
        set $forwarded_host "";

        include /etc/nginx/app.conf;

        # Le UI di amministrazione esistono solo sulla porta admin (:8081).
        #
        # Il filtro NON puo' stare in PHP: bootstrap/app.php ha
        # trustProxies(at: '*'), quindi $request->ip() arriva da X-Forwarded-For
        # ed e' falsificabile con un header; e comunque nginx vede sempre l'IP
        # del proxy davanti, identico per traffico pubblico e tunnelato.
        # Discrimina la porta di ingresso, non l'IP.
        #
        # `^~` vince sulle location regex, quindi batte `~ \.php$` senza
        # dipendere dall'ordine. 404 e non 403: non conferma che esistano.
        location ^~ /horizon            { return 404; }
        location ^~ /log-viewer         { return 404; }
        location ^~ /pulse              { return 404; }
        # Gli asset statici di log-viewer. Horizon e Pulse non ne hanno:
        # inlineano CSS e JS nel layout (Pulse via Livewire), quindi non
        # esiste nessun /vendor/horizon o /vendor/pulse da bloccare.
        location ^~ /vendor/log-viewer  { return 404; }
    }

    # ─── Admin: solo via LocalForward SSH ─────────────────────────────────────
    # Nessun 404: questa porta serve l'app completa, Horizon e log-viewer
    # inclusi. HorizonBasicAuth / LogViewerBasicAuth restano come seconda
    # cintura, ma l'autenticazione vera e' la chiave SSH del tunnel.
    server {
        listen 8081;

        # Qui davanti non c'e' nessun proxy: senza questo `asset()` genera URL
        # senza porta e gli asset di log-viewer non caricano nel tunnel.
        set $forwarded_host $http_host;

        include /etc/nginx/app.conf;
    }
}

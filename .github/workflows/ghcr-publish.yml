# ==============================================================================
# Build dell'immagine di produzione e push su GitHub Container Registry (ghcr.io).
#
# Traduzione 1:1 di .forgejo/workflows/ghcr-publish.yml per GitHub Actions.
#
# Trigger: pubblicazione di una release (non piu' ogni push su main). L'immagine
# viene taggata `latest` + titolo della release.
#
# Il job `tests` gira per primo: `build-push` ha `needs: tests`, quindi
# nessuna immagine viene pubblicata se la suite PHPUnit fallisce.
#
# Runner: `ubuntu-latest` (GitHub-hosted) — a differenza del runner Forgejo
# (container docker:29-cli / php:8.5-cli nudi) qui git, node e Docker sono
# già presenti, quindi non serve installarli a mano; PHP e le estensioni sono
# gestite da shivammathur/setup-php.
#
# Auth su ghcr.io: usa il GITHUB_TOKEN generato automaticamente (permessi
# `packages: write` sotto), non un PAT — a differenza di Forgejo, dove
# GHCR_USERNAME/GHCR_TOKEN erano necessari perché il runner non ha un token
# equivalente. Il repo deve avere i package collegati come "public"/visibili
# secondo le impostazioni desiderate (Settings → Packages).
#
# A differenza della dashboard, qui NON ci sono build-arg: l'immagine non
# incorpora nessuna configurazione. APP_KEY, DB_*, REDIS_*, REVERB_*,
# HORIZON_*/LOG_VIEWER_* vanno iniettate come environment variable al deploy,
# quindi la stessa immagine vale per tutti gli ambienti.
# ==============================================================================
name: GHCR publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # Gate: l'immagine non viene costruita se la suite non passa.
  # Nessun servizio esterno: la configurazione arriva da .env.testing
  # (versionato) copiato in .env, e il database e' SQLite su file.
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Estensioni richieste da composer.json: zip, pcntl (horizon),
      # exif (medialibrary), gd (usata da UploadedFile::fake()->image()
      # nei test). pdo_sqlite/sqlite3 sono già incluse dall'action.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: zip, pcntl, exif, gd
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Security audit
        run: composer audit --no-dev

      - name: Prepare environment
        run: |
          cp .env.testing .env
          touch database/testing.sqlite

      - name: Run tests
        run: php artisan test --compact

  build-push:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # RELEASE_TAG: titolo della release, normalizzato ai caratteri ammessi in
      # un tag Docker ([A-Za-z0-9_.-], max 128). Fallback: tag_name, poi il ref.
      # `github.repository` è già in lowercase, a differenza di GHCR_USERNAME
      # su Forgejo che poteva non esserlo.
      - name: Resolve tag
        run: |
          RAW="${{ github.event.release.name || github.event.release.tag_name || github.ref_name }}"
          RELEASE_TAG=$(echo "$RAW" | sed 's/[^A-Za-z0-9_.-]/-/g' | cut -c1-128)
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Il Dockerfile usa `# syntax=` e BuildKit legge
      # docker/production/Dockerfile.dockerignore per filtrare il context.
      # Il context è la ROOT del repo (serve composer.json).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}

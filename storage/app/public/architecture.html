<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>matches-api — Architecture Map</title>
<style>
  :root{
    --bg:#0c1016; --bg-2:#11161f; --panel:#121822; --line:#243043;
    --fg:#e6edf7; --fg-dim:#8fa0b8; --fg-faint:#63748d;
    --accent:#5ec8ff; --accent-2:#ffb454;
    --entry:#3d7dd8; --domain:#7a5cd6; --data:#2f9e6e; --async:#c9803a; --integration:#c2557d; --infra:#4b5a71;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  #app{display:flex; height:100vh; width:100%}

  /* ---------- diagram ---------- */
  #stage{position:relative; flex:1 1 auto; min-width:0; overflow:hidden; background:
      radial-gradient(1200px 700px at 30% -10%, #131b27 0%, var(--bg) 60%)}
  svg#graph{width:100%; height:100%; display:block; touch-action:none; cursor:grab}
  svg#graph.grabbing{cursor:grabbing}

  .band-label{fill:var(--fg-faint); font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase}
  .band-rule{stroke:var(--line); stroke-width:1; stroke-dasharray:2 6}

  .edge{fill:none; stroke:#33445e; stroke-width:1.1; opacity:.55}
  .edge.hot{stroke:var(--accent); stroke-width:2; opacity:1}
  .edge.on{stroke:var(--accent-2); stroke-width:2.2; opacity:1}
  .edge.dim{opacity:.07}
  .edge-hit{fill:none; stroke:transparent; stroke-width:12; cursor:pointer}
  .edge-label{fill:var(--accent); font-size:11px; paint-order:stroke; stroke:#0c1016; stroke-width:4px; stroke-linejoin:round}

  .node rect{stroke-width:1.2; rx:8; ry:8}
  .node text{font-size:12.5px; font-weight:500; dominant-baseline:middle; pointer-events:none}
  .node{cursor:pointer}
  .node.dim{opacity:.13}
  .node.on rect{stroke:var(--accent-2); stroke-width:2.4}
  .node.hot rect{stroke:var(--accent); stroke-width:2.2}

  .flowline{fill:none; stroke:var(--accent-2); stroke-width:2.4; stroke-dasharray:7 6; opacity:.9}
  .badge circle{fill:var(--accent-2); stroke:#0c1016; stroke-width:1.5}
  .badge text{fill:#20140a; font-size:11px; font-weight:700; text-anchor:middle; dominant-baseline:central}

  #tooltip{
    position:absolute; z-index:20; max-width:330px; pointer-events:none; opacity:0;
    transition:opacity .12s ease; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; box-shadow:0 12px 34px rgba(0,0,0,.55);
    overflow-wrap:anywhere;
  }
  #tooltip.show{opacity:1}
  #tooltip .tt-title{font-weight:650; margin-bottom:3px}
  #tooltip .tt-meta{font-size:11.5px; color:var(--fg-dim); margin-bottom:6px}
  #tooltip .tt-path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:var(--accent); margin-bottom:6px}
  #tooltip .tt-desc{font-size:12.5px; color:var(--fg-dim)}

  #controls{position:absolute; left:14px; top:14px; display:flex; gap:8px; flex-wrap:wrap; z-index:10}
  #controls button{
    background:var(--panel); color:var(--fg-dim); border:1px solid var(--line); border-radius:8px;
    padding:6px 11px; font-size:12px; cursor:pointer;
  }
  #controls button:hover{color:var(--fg); border-color:#3b4d69}
  #hint{position:absolute; right:14px; bottom:12px; font-size:11.5px; color:var(--fg-faint); z-index:10}

  /* ---------- panel ---------- */
  #panel{
    flex:0 0 340px; background:var(--bg-2); border-left:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0; overflow-wrap:anywhere;
  }
  #panel header{padding:18px 18px 12px; border-bottom:1px solid var(--line)}
  #panel h1{margin:0; font-size:16px; letter-spacing:.01em}
  #panel .sub{margin-top:4px; font-size:12px; color:var(--fg-dim)}
  #panel .scroll{overflow-y:auto; padding:14px 18px 28px; min-height:0}
  .sect{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg-faint); margin:6px 0 10px}

  .legend{display:flex; flex-wrap:wrap; gap:6px 12px; margin-bottom:18px}
  .legend span{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--fg-dim)}
  .legend i{width:10px; height:10px; border-radius:3px; display:inline-block}

  .flow{
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:9px;
    cursor:pointer; background:#0f141d;
  }
  .flow:hover{border-color:#3b4d69}
  .flow.active{border-color:var(--accent-2); background:#191408}
  .flow .fname{font-size:13.5px; font-weight:600}
  .flow .fdesc{font-size:12px; color:var(--fg-dim); margin-top:4px}

  ol.steps{list-style:none; margin:10px 0 4px; padding:0; counter-reset:s}
  ol.steps li{
    counter-increment:s; display:flex; gap:9px; align-items:flex-start;
    padding:5px 6px; border-radius:7px; cursor:pointer; font-size:12.5px;
  }
  ol.steps li:hover{background:#1a2130}
  ol.steps li::before{
    content:counter(s); flex:0 0 18px; height:18px; margin-top:1px; border-radius:50%;
    background:var(--accent-2); color:#20140a; font-size:10.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  ol.steps .sp{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; color:var(--fg-faint); display:block}

  @media (max-width:900px){
    body{overflow:auto}
    #app{flex-direction:column; height:auto; min-height:100vh}
    #stage{height:62vh; flex:none}
    #panel{flex:none; width:100%; border-left:0; border-top:1px solid var(--line)}
    #panel .scroll{overflow:visible}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <svg id="graph"><g id="root">
      <g id="bands"></g><g id="edges"></g><g id="overlay"></g><g id="nodes"></g><g id="edgelabels"></g>
    </g></svg>
    <div id="controls">
      <button id="btn-fit">Fit graph</button>
      <button id="btn-clear">Clear flow</button>
    </div>
    <div id="hint">Scroll to zoom · drag to pan · hover a node for details</div>
    <div id="tooltip"></div>
  </div>

  <aside id="panel">
    <header>
      <h1>matches-api — Architecture Map</h1>
      <div class="sub" id="counts"></div>
    </header>
    <div class="scroll">
      <div class="sect">Layers</div>
      <div class="legend" id="legend"></div>
      <div class="sect">Flows</div>
      <div id="flows"></div>
    </div>
  </aside>
</div>

ath":"app/Http/Controllers/Api/DashboardController.php","description":"Returns per-tournament counters (registrations paid/arrived, matches by status) for active tournaments."},{"id":"user-controller","label":"UserController","type":"controller","layer":"entry","path":"app/Http/Controllers/Api/UserController.php","description":"CRUD plus bulk delete for admin users, the only policy-guarded resource."},{"id":"weight-category-controller","label":"WeightCategoryController","type":"controller","layer":"entry","path":"app/Http/Controllers/Api/WeightCategoryController.php","description":"CRUD plus bulk delete for the shared weight-category reference data."},{"id":"discipline-controller","label":"DisciplineController","type":"controller","layer":"entry","path":"app/Http/Controllers/Api/DisciplineController.php","description":"CRUD plus bulk delete for disciplines, including default rounds and minutes per round."},{"id":"experience-tier-controller","label":"ExperienceTierController","type":"controller","layer":"entry","path":"app/Http/Controllers/Api/ExperienceTierController.php","description":"CRUD plus bulk delete for experience tiers, the global match-count bands used by matchmaking."},{"id":"athlete-controller","label":"AthleteController","type":"controller","layer":"entry","path":"app/Http/Controllers/Api/AthleteController.php","description":"Athlete CRUD with filters (gender, adult, match-count range, tournament membership) and photo attachment."},{"id":"tournament-controller","label":"TournamentController","type":"controller","layer":"entry","path":"app/Http/Controllers/Api/TournamentController.php","description":"Tournament CRUD with cover-image attachment and transactional bulk delete."},{"id":"tournament-registration-controller","label":"TournamentRegistrationController","type":"controller","layer":"entry","path":"app/Http/Controllers/Api/TournamentRegistrationController.php","description":"Nested index/store for a tournament's registrations under /tournaments/{tournament}/registrations."},{"id":"tournament-match-record-controller","label":"TournamentMatchRecordController","type":"controller","layer":"entry","path":"app/Http/Controllers/Api/TournamentMatchRecordController.php","description":"Nested match-record index/store plus the two custom actions: generate the fight card and render the match-sheet PDF."},{"id":"tournament-experience-tier-controller","label":"TournamentExperienceTierController","type":"controller","layer":"entry","path":"app/Http/Controllers/Api/TournamentExperienceTierController.php","description":"Nested index/store for a tournament's own experience tiers, which override the global ones."},{"id":"registration-controller","label":"RegistrationController","type":"controller","layer":"entry","path":"app/Http/Controllers/Api/RegistrationController.php","description":"Registration CRUD with unpaid/unarrived/weight-exceeded filters and the single-registration PDF."},{"id":"match-record-controller","label":"MatchRecordController","type":"controller","layer":"entry","path":"app/Http/Controllers/Api/MatchRecordController.php","description":"Flat match-record CRUD used to edit a bout's result, status and position in the card."},{"id":"temporary-upload-controller","label":"TemporaryUploadController","type":"controller","layer":"entry","path":"app/Http/Controllers/Api/TemporaryUploadController.php","description":"Accepts a file up front and returns a temporary id later attached to a model's media collection."},{"id":"media-controller","label":"MediaController","type":"controller","layer":"entry","path":"app/Http/Controllers/MediaController.php","description":"Orphan: exposes download and destroy for media but no route file references it, so it is currently unreachable."},{"id":"public-registration-form-controller","label":"PublicRegistrationFormController","type":"controller","layer":"entry","path":"app/Http/Controllers/Api/PublicRegistrationFormController.php","description":"Unauthenticated registration funnel: athlete lookup by tax number, athlete/registration creation, reference lists and the registration PDF."},{"id":"public-tournament-controller","label":"PublicTournamentController","type":"controller","layer":"entry","path":"app/Http/Controllers/Api/PublicTournamentController.php","description":"Public read-only board of in-progress and completed tournaments and their match records, response-cached for 60 seconds."},{"id":"tournament-model","label":"Tournament","type":"model","layer":"domain","path":"app/Models/Tournament.php","description":"Aggregate root of the domain: owns registrations, match records and experience tiers, and drives matchmaking."},{"id":"athlete-model","label":"Athlete","type":"model","layer":"domain","path":"app/Models/Athlete.php","description":"Competitor identified publicly by tax number; derives age, adult status and total match count from generic plus registered bouts."},{"id":"registration-model","label":"Registration","type":"model","layer":"domain","path":"app/Models/Registration.php","description":"Join of athlete, tournament, discipline and weight category tracking payment, arrival and weigh-in, and detecting duplicates."},{"id":"match-record-model","label":"MatchRecord","type":"model","layer":"domain","path":"app/Models/MatchRecord.php","description":"A bout between a red and a blue corner with contiguous sort order, status, end method and judges' points."},{"id":"discipline-model","label":"Discipline","type":"model","layer":"domain","path":"app/Models/Discipline.php","description":"Reference data for a fighting discipline plus its default round count and round length."},{"id":"weight-category-model","label":"WeightCategory","type":"model","layer":"domain","path":"app/Models/WeightCategory.php","description":"Reference data holding a weight limit used both for pairing and for weigh-in checks."},{"id":"experience-tier-model","label":"ExperienceTier","type":"model","layer":"domain","path":"app/Models/ExperienceTier.php","description":"A no ication carrying the frontend reset URL built from the Laravel password broker token."},{"id":"cleanup-temporary-uploads-command","label":"CleanupTemporaryUploadsCommand","type":"job","layer":"async","path":"app/Console/Commands/CleanupTemporaryUploadsCommand.php","description":"Deletes temp files older than the given minutes so abandoned uploads do not accumulate."},{"id":"scheduler","label":"Task scheduler","type":"infra","layer":"async","path":"routes/console.php","description":"Schedules upload cleanup every six hours, horizon:snapshot every five minutes, and nightly backups only when the backup disk is configured."},{"id":"spatie-laravel-pdf","label":"spatie/laravel-pdf","type":"external","layer":"integration","path":"config/laravel-pdf.php","description":"Renders Blade views to A4 PDFs through the DOMPDF driver."},{"id":"pdf-views","label":"PDF Blade templates","type":"other","layer":"integration","path":"resources/views/pdf","description":"Server-rendered sheets: one registration form and the simple/detailed tournament match-record cards."},{"id":"email-view-reset-password","label":"Reset-password email view","type":"other","layer":"integration","path":"resources/views/emails/auth/reset-password.blade.php","description":"The only mail template; renders the password-reset link sent to an admin user."},{"id":"mailer","label":"SMTP mailer","type":"external","layer":"integration","path":"config/mail.php","description":"Outgoing mail transport, pointed at Mailpit in local development."},{"id":"spatie-medialibrary","label":"spatie/laravel-medialibrary","type":"external","layer":"integration","path":"config/media-library.php","description":"Stores model files and queues conversions after commit, using the app's overridden Media model."},{"id":"s3-storage","label":"S3-compatible object storage","type":"external","layer":"integration","path":"config/filesystems.php","description":"Destination disk for media and for nightly backups, accessed via league/flysystem-aws-s3 const LAYERS = [
  ['entry',       'Entry',       'var(--entry)',       '#3d7dd8'],
  ['domain',      'Domain',      'var(--domain)',      '#7a5cd6'],
  ['data',        'Data',        'var(--data)',        '#2f9e6e'],
  ['async',       'Async',       'var(--async)',       '#c9803a'],
  ['integration', 'Integration', 'var(--integration)', '#c2557d'],
  ['infra',       'Infra',       'var(--infra)',       '#4b5a71'],
];
const COLOR = Object.fromEntries(LAYERS.map(l => [l[0], l[3]]));
const NS = 'http://www.w3.org/2000/svg';

const NODE_W = 190, NODE_H = 46, GAP_X = 26, GAP_Y = 20, BAND_HEAD = 26, BAND_GAP = 44, PAD = 40;

const byId = Object.fromEntries(GRAPH.nodes.map(n => [n.id, n]));
const svg = document.getElementById('graph');
const root = document.getElementById('root');
const gBands = document.getElementById('bands');
const gEdges = document.getElementById('edges');
const gOverlay = document.getElementById('overlay');
const gNodes = document.getElementById('nodes');
const gEdgeLabels = document.getElementById('edgelabels');
const tooltip = document.getElementById('tooltip');
const stage = document.getElementById('stage');

let layout = null;          // {pos:{id:{x,y}}, width, height}
let activeFlow = null;
let view = {x:0, y:0, k:1};

/* ------------------------------------------------------------------ layout */
function bandsOf(){
  return LAYERS.map(([key,label]) => ({key, label, nodes: GRAPH.nodes.filter(n => n.layer === key)}))
               .filter(b => b.nodes.length);
}

function computeLayout(cols){
  const bands = bandsOf();
  const width = cols * NODE_W + (cols - 1) * GAP_X;
  const pos = {}, bandBoxes = [];
  let y = 0;
  bands.forEach((band, bi) => {
    if (bi) y += BAND_GAP;
    const top = y;
    y += BAND_HEAD;
    const rows = Math.ceil(band.nodes.length / cols);
    for (let r = 0; r < rows; r++){
      const slice = band.nodes.slice(r * cols, (r + 1) * cols);
      const rowW = slice.length * NODE_W + (slice.length - 1) * GAP_X;
      const x0 = (width - rowW) / 2;
      slice.forEach((n, i) => {
        pos[n.id] = {x: x0 + i * (NODE_W + GAP_X), y: y + r * (NODE_H + GAP_Y)};
      });
    }
    y += rows * NODE_H + (rows - 1) * GAP_Y;
    bandBoxes.push({label: band.label, key: band.key, top, bottom: y});
  });
  return {pos, bandBoxes, width, height: y, cols};
}

/** Pick the column count whose aspect ratio fits the current stage best. */
function bestLayout(){
  const w = stage.clientWidth - PAD * 2, h = stage.clientHeight - PAD * 2;
  let best = null;
  for (let cols = 4; cols <= 12; cols++){
    const L = computeLayout(cols);
    const k = Math.min(w / L.width, h / L.height);
    if (!best || k > best.k) best = {k, L};
  }
  return best.L;
}

/* ------------------------------------------------------------------ render */
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function fitText(textEl, str, max){
  textEl.textContent = str;
  if (textEl.getComputedTextLength() <= max) return;
  let s = str;
  while (s.length > 2 && textEl.getComputedTextLength() > max){
    s = s.slice(0, -1);
    textEl.textContent = s + '…';
  }
}

function anchor(a, b){
  // point on rect `a` border, on the segment towards the centre of `b`
  const ac = {x: a.x + NODE_W / 2, y: a.y + NODE_H / 2};
  const bc = {x: b.x + NODE_W / 2, y: b.y + NODE_H / 2};
  const dx = bc.x - ac.x, dy = bc.y - ac.y;
  if (!dx && !dy) return ac;
  const sx = dx ? (NODE_W / 2) / Math.abs(dx) : Infinity;
  const sy = dy ? (NODE_H / 2) / Math.abs(dy) : Infinity;
  const t = Math.min(sx, sy);
  return {x: ac.x + dx * t, y: ac.y + dy * t};
}

function edgePath(from, to){
  const a = anchor(from, to), b = anchor(to, from);
  const dy = b.y - a.y, dx = b.x - a.x;
  const off = Math.max(24, Math.min(120, Math.abs(dy) * .45 + Math.abs(dx) * .08));
  const vertical = Math.abs(dy) >= Math.abs(dx);
  const c1 = vertical ? {x: a.x, y: a.y + Math.sign(dy || 1) * off} : {x: a.x + Math.sign(dx || 1) * off, y: a.y};
  const c2 = vertical ? {x: b.x, y: b.y - Math.sign(dy || 1) * off} : {x: b.x - Math.sign(dx || 1) * off, y: b.y};
  return `M${a.x},${a.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${b.x},${b.y}`;
}

function render(){
  layout = bestLayout();
  [gBands, gEdges, gOverlay, gNodes, gEdgeLabels].forEach(g => g.replaceChildren());

  let defs = svg.querySelector('defs');
  if (!defs){
    defs = el('defs', {}, svg);
    const mk = (id, color) => {
      const m = el('marker', {id, viewBox:'0 0 8 8', refX:'7', refY:'4', markerWidth:'6',
                              markerHeight:'6', orient:'auto-start-reverse'}, defs);
      el('path', {d:'M0,0 L8,4 L0,8 z', fill:color}, m);
    };
    mk('arrow', '#33445e'); mk('arrow-hot', '#5ec8ff'); mk('arrow-on', '#ffb454');
  }

  // bands
  layout.bandBoxes.forEach(b => {
    el('text', {x: 0, y: b.top + 14, class:'band-label'}, gBands).textContent = b.label;
    el('line', {x1: 0, y1: b.top + 19, x2: layout.width, y2: b.top + 19, class:'band-rule'}, gBands);
  });

  // edges
  GRAPH.edges.forEach((e, i) => {
    const a = layout.pos[e.from], b = layout.pos[e.to];
    const d = edgePath(a, b);
    const p = el('path', {d, class:'edge', 'marker-end':'url(#arrow)', 'data-i': i}, gEdges);
    const hit = el('path', {d, class:'edge-hit', 'data-i': i}, gEdges);
    e._path = p;
    hit.addEventListener('pointerenter', () => showEdgeLabel(e, i));
    hit.addEventListener('pointerleave', hideEdgeLabel);
  });

  // nodes
  GRAPH.nodes.forEach(n => {
    const p = layout.pos[n.id];
    const g = el('g', {class:'node', 'data-id': n.id, transform:`translate(${p.x},${p.y})`}, gNodes);
    el('rect', {width: NODE_W, height: NODE_H, fill: COLOR[n.layer] + '2e', stroke: COLOR[n.layer]}, g);
    el('rect', {width: 4, height: NODE_H, fill: COLOR[n.layer], rx: 2}, g);
    const t = el('text', {x: 14, y: NODE_H / 2, fill:'#e6edf7'}, g);
    fitText(t, n.label, NODE_W - 24);
    n._g = g;
    g.addEventListener('pointerenter', ev => { showTip(n, ev); highlight(n.id, true); });
    g.addEventListener('pointerleave', () => { hideTip(); highlight(n.id, false); });
    g.addEventListener('click', ev => { ev.stopPropagation(); showTip(n, ev); });
  });

  applyFlow();
}

/* ------------------------------------------------------------ interactions */
function showEdgeLabel(e, i){
  if (activeFlow) return;
  e._path.classList.add('hot');
  e._path.setAttribute('marker-end', 'url(#arrow-hot)');
  const a = layout.pos[e.from], b = layout.pos[e.to];
  const mx = (a.x + b.x) / 2 + NODE_W / 2, my = (a.y + b.y) / 2 + NODE_H / 2;
  const t = el('text', {x: mx, y: my, class:'edge-label', 'text-anchor':'middle'}, gEdgeLabels);
  t.textContent = e.label ? `${e.type} · ${e.label}` : e.type;
}
function hideEdgeLabel(){
  gEdgeLabels.replaceChildren();
  GRAPH.edges.forEach(e => {
    e._path.classList.remove('hot');
    if (!e._path.classList.contains('on')) e._path.setAttribute('marker-end', 'url(#arrow)');
  });
}

function highlight(id, on){
  if (activeFlow) return;
  GRAPH.edges.forEach(e => {
    if (e.from !== id && e.to !== id) return;
    e._path.classList.toggle('hot', on);
    e._path.setAttribute('marker-end', on ? 'url(#arrow-hot)' : 'url(#arrow)');
    const other = byId[e.from === id ? e.to : e.from];
    other._g.classList.toggle('hot', on);
  });
  byId[id]._g.classList.toggle('hot', on);
}

function showTip(n, ev){
  tooltip.innerHTML =
    `<div class="tt-title"></div><div class="tt-meta"></div><div class="tt-path"></div><div class="tt-desc"></div>`;
  tooltip.querySelector('.tt-title').textContent = n.label;
  tooltip.querySelector('.tt-meta').textContent = `${n.type} · ${n.layer}`;
  tooltip.querySelector('.tt-path').textContent = n.path;
  tooltip.querySelector('.tt-desc').textContent = n.description;
  tooltip.classList.add('show');
  const r = stage.getBoundingClientRect();
  const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
  let x = (ev.clientX - r.left) + 16, y = (ev.clientY - r.top) + 16;
  x = Math.max(8, Math.min(x, r.width - tw - 8));
  y = Math.max(8, Math.min(y, r.height - th - 8));
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}
function hideTip(){ tooltip.classList.remove('show'); }

/* -------------------------------------------------------------------- view */
function applyView(){
  root.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
}
function fitTo(ids){
  if (!layout) return;
  let box;
  if (ids && ids.length){
    const xs = ids.map(i => layout.pos[i].x), ys = ids.map(i => layout.pos[i].y);
    box = {x: Math.min(...xs), y: Math.min(...ys),
           w: Math.max(...xs) + NODE_W - Math.min(...xs), h: Math.max(...ys) + NODE_H - Math.min(...ys)};
  } else {
    box = {x: 0, y: 0, w: layout.width, h: layout.height};
  }
  const W = stage.clientWidth, H = stage.clientHeight;
  const k = Math.min((W - PAD * 2) / box.w, (H - PAD * 2) / box.h, 1.6);
  view.k = k;
  view.x = (W - box.w * k) / 2 - box.x * k;
  view.y = (H - box.h * k) / 2 - box.y * k;
  applyView();
}

svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const f = Math.exp(-ev.deltaY * 0.0016);
  const k = Math.max(0.12, Math.min(4, view.k * f));
  const ratio = k / view.k;
  view.x = mx - (mx - view.x) * ratio;
  view.y = my - (my - view.y) * ratio;
  view.k = k;
  applyView();
}, {passive:false});

let drag = null;
svg.addEventListener('pointerdown', ev => {
  drag = {x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y};
  svg.setPointerCapture(ev.pointerId);
  svg.classList.add('grabbing');
});
svg.addEventListener('pointermove', ev => {
  if (!drag) return;
  view.x = drag.vx + (ev.clientX - drag.x);
  view.y = drag.vy + (ev.clientY - drag.y);
  applyView();
});
const endDrag = () => { drag = null; svg.classList.remove('grabbing'); };
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('click', ev => { if (ev.target === svg || ev.target.closest('#bands')) hideTip(); });

/* ------------------------------------------------------------------- flows */
function stepEdgeKey(a, b){ return a + '␀' + b; }

function applyFlow(){
  gOverlay.replaceChildren();
  const flow = activeFlow && GRAPH.flows.find(f => f.id === activeFlow);

  if (!flow){
    GRAPH.nodes.forEach(n => n._g.classList.remove('dim','on'));
    GRAPH.edges.forEach(e => {
      e._path.classList.remove('dim','on','hot');
      e._path.setAttribute('marker-end', 'url(#arrow)');
    });
    return;
  }

  const onNodes = new Set(flow.steps);
  const pairs = new Set();
  for (let i = 0; i < flow.steps.length - 1; i++) pairs.add(stepEdgeKey(flow.steps[i], flow.steps[i+1]));

  GRAPH.nodes.forEach(n => {
    n._g.classList.toggle('on', onNodes.has(n.id));
    n._g.classList.toggle('dim', !onNodes.has(n.id));
    n._g.classList.remove('hot');
  });
  GRAPH.edges.forEach(e => {
    const on = pairs.has(stepEdgeKey(e.from, e.to));
    e._path.classList.toggle('on', on);
    e._path.classList.toggle('dim', !on);
    e._path.classList.remove('hot');
    e._path.setAttribute('marker-end', on ? 'url(#arrow-on)' : 'url(#arrow)');
  });

  // ordered overlay through every step, direct edge or not
  const pts = flow.steps.map(id => {
    const p = layout.pos[id];
    return {x: p.x + NODE_W / 2, y: p.y + NODE_H / 2};
  });
  let d = `M${pts[0].x},${pts[0].y}`;
  for (let i = 1; i < pts.length; i++){
    const a = pts[i-1], b = pts[i];
    const off = Math.max(20, Math.abs(b.y - a.y) * .35);
    d += ` C${a.x},${a.y + off} ${b.x},${b.y - off} ${b.x},${b.y}`;
  }
  el('path', {d, class:'flowline'}, gOverlay);
  pts.forEach((p, i) => {
    const g = el('g', {class:'badge', transform:`translate(${p.x - NODE_W/2 + 2},${p.y - NODE_H/2 - 2})`}, gOverlay);
    el('circle', {r: 10, cx: 0, cy: 0}, g);
    el('text', {x: 0, y: 0}, g).textContent = String(i + 1);
  });

  fitTo(flow.steps);
}

function selectFlow(id){
  activeFlow = (activeFlow === id) ? null : id;
  buildFlowList();
  applyFlow();
  if (!activeFlow) fitTo(null);
}

function buildFlowList(){
  const wrap = document.getElementById('flows');
  wrap.replaceChildren();
  GRAPH.flows.forEach(f => {
    const div = document.createElement('div');
    div.className = 'flow' + (activeFlow === f.id ? ' active' : '');
    const name = document.createElement('div');
    name.className = 'fname'; name.textContent = f.name;
    const desc = document.createElement('div');
    desc.className = 'fdesc'; desc.textContent = f.description;
    div.append(name, desc);
    div.addEventListener('click', () => selectFlow(f.id));

    if (activeFlow === f.id){
      const ol = document.createElement('ol');
      ol.className = 'steps';
      f.steps.forEach(sid => {
        const n = byId[sid];
        const li = document.createElement('li');
        const box = document.createElement('div');
        box.textContent = n.label;
        const sp = document.createElement('span');
        sp.className = 'sp'; sp.textContent = n.path;
        box.appendChild(sp);
        li.appendChild(box);
        li.addEventListener('click', ev => { ev.stopPropagation(); centerOn(sid); });
        ol.appendChild(li);
      });
      div.appendChild(ol);
    }
    wrap.appendChild(div);
  });
}

function centerOn(id){
  const p = layout.pos[id];
  const k = Math.max(view.k, 0.85);
  view.k = k;
  view.x = stage.clientWidth / 2 - (p.x + NODE_W / 2) * k;
  view.y = stage.clientHeight / 2 - (p.y + NODE_H / 2) * k;
  applyView();
}

/* -------------------------------------------------------------------- init */
function buildLegend(){
  const wrap = document.getElementById('legend');
  LAYERS.forEach(([key, label, , hex]) => {
    const n = GRAPH.nodes.filter(x => x.layer === key).length;
    if (!n) return;
    const s = document.createElement('span');
    const i = document.createElement('i');
    i.style.background = hex;
    s.append(i, document.createTextNode(`${label} (${n})`));
    wrap.appendChild(s);
  });
  document.getElementById('counts').textContent =
    `${GRAPH.nodes.length} nodes · ${GRAPH.edges.length} edges · ${GRAPH.flows.length} flows`;
}

document.getElementById('btn-fit').addEventListener('click', () => fitTo(activeFlow ? GRAPH.flows.find(f => f.id === activeFlow).steps : null));
document.getElementById('btn-clear').addEventListener('click', () => { if (activeFlow) selectFlow(activeFlow); });

buildLegend();
buildFlowList();
render();
requestAnimationFrame(() => { render(); fitTo(null); });
window.addEventListener('load', () => { render(); fitTo(activeFlow ? GRAPH.flows.find(f => f.id === activeFlow).steps : null); });

let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    render();
    fitTo(activeFlow ? GRAPH.flows.find(f => f.id === activeFlow).steps : null);
  }, 140);
});
</script>
</body>

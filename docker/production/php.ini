; Copied to $PHP_INI_DIR/conf.d/zz-app.ini so it loads AFTER php.ini-production
; and after every docker-php-ext-* ini file. The zz- prefix keeps it last.

; ─── OPcache ─────────────────────────────────────────────────────────────────
; php:8.5 compiles OPcache statically and already enables it, but with
; conservative defaults: 128M / 10000 files / validate_timestamps=On / JIT off.
; This block raises the buffers and turns the JIT on.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; The source tree is immutable inside the image, so skip the per-request stat()
; calls. Consequence: code changes require a new image — editing files inside a
; running container has no effect until the container is replaced.
opcache.validate_timestamps=0

; JIT tracing is disabled: PHP 8.5.9+ has an upstream OPcache JIT tracing
; miscompilation bug (php-src#23346) that corrupts calls to internal
; functions in long-lived workers (php-fpm), observed here as spurious
; ArgumentCountError crashes inside Carbon. Re-enable once that bug is fixed
; upstream and the fixed PHP version is in use.
opcache.jit=disable
opcache.jit_buffer_size=0

; ─── Hardening ───────────────────────────────────────────────────────────────
expose_php=Off

; ─── Runtime limits ──────────────────────────────────────────────────────────
; memory_limit bounds a single worker. Combined with pm.max_children in
; php-fpm.conf it sets the pool's worst-case footprint — keep the two in sync
; when tuning for a smaller VPS.
memory_limit=256M

realpath_cache_size=4096k
realpath_cache_ttl=600

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
; Worst-case pool footprint is pm.max_children x memory_limit (256M, set in
; docker/production/php.ini) = ~2GB. Horizon (10 processes x 128M), Reverb and
; the scheduler share the SAME container, so an OOM here also kills nginx.
; Lower this first when deploying to a small VPS.
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Laravel reads its configuration from the container environment; clearing it
; would hide every runtime variable from the workers.
clear_env = no

; Surface worker fatals in `docker logs` instead of only in the pool log.
catch_workers_output = yes
decorate_workers_output = no

; Must stay in sync with client_max_body_size in docker/production/nginx.conf.
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size] = 100M

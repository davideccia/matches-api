name: matches-api

services:
  app:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
      target: production
    image: matches-api:latest
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL is required}
      REVERB_PORT: ${REVERB_PORT:-8080}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      DB_HOST: pgsql
      REDIS_HOST: redis
    env_file:
      - .env.production
    volumes:
      # ACME certificates and keys — never drop this, see docker/production/Dockerfile
      - ./data/caddy/data:/data
      - ./data/app/storage:/var/www/storage/app
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  pgsql:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ./data/pgsql/data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD', 'pg_isready', '-U', '${DB_USERNAME}', '-d', '${DB_DATABASE}' ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis/data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5

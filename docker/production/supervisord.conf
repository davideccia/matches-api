[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

; Without these three sections `supervisorctl status` cannot reach supervisord,
; which is the primary way to inspect the five processes inside the container.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; Every program below logs to the container's stdout/stderr: these are SERVICE
; logs, consumed via `docker logs`. Laravel's APPLICATION log is separate — it
; writes daily files under storage/logs (LOG_CHANNEL=daily) so that the
; /log-viewer dashboard has files to read.

[program:nginx]
; Runs as root so it can bind :80; workers drop to www-data (see nginx.conf).
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
startsecs=3
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
startsecs=3
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:horizon]
command=php /var/www/artisan horizon
user=www-data
autostart=true
autorestart=true
; Horizon terminates gracefully on SIGTERM: it finishes the job in flight before
; exiting, so give it room rather than killing mid-job.
stopsignal=TERM
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
; REVERB_SERVER_PORT is the LISTEN port (config/reverb.php).
; REVERB_HOST/REVERB_PORT/REVERB_SCHEME are what clients are told to connect to
; (reverb.<domain>:443 over https) and must NOT be used here.
command=php /var/www/artisan reverb:start --host=0.0.0.0 --port=%(ENV_REVERB_SERVER_PORT)s
user=www-data
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pulse]
; Persistent process, same shape as horizon: pulse:check loops internally
; (SharedBeat every second) rather than being scheduled per run. Each beat
; also rolls a lottery (config('pulse.ingest.trim.lottery'), default
; 1/1000) that, on a win, prunes rows older than
; config('pulse.storage.trim.keep') (PULSE_STORAGE_KEEP, default 7 days) —
; this is what prunes old Pulse data, no separate command needed.
command=php /var/www/artisan pulse:check
user=www-data
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/artisan schedule:work
user=www-data
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

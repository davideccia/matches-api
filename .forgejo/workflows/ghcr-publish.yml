# ==============================================================================
# Build dell'immagine di produzione e push su GitHub Container Registry (ghcr.io).
#
# Runner: label `docker-29-cli` → il job gira in un'immagine docker:29-cli
# (CLI + buildx, daemon raggiunto via socket dell'host). Nessuna node action
# oltre a checkout, così il workflow non dipende da mirror di docker/*-action.
#
# Variables (pannello Forgejo): GHCR_USERNAME
# Secrets: GHCR_TOKEN (PAT con scope write:packages)
#
# A differenza della dashboard, qui NON ci sono build-arg: l'immagine non
# incorpora nessuna configurazione. APP_KEY, DB_*, REDIS_*, REVERB_*,
# HORIZON_*/LOG_VIEWER_* vanno iniettate come environment variable al deploy,
# quindi la stessa immagine vale per tutti gli ambienti.
# ==============================================================================
name: GHCR publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: docker-29-cli
    steps:
      # docker:29-cli è alpine e non ha né git né node: checkout@v6 è una node
      # action, il runner la lancia con `node` dentro questo container.
      - name: Install checkout deps
        run: apk add --no-cache git nodejs

      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6

      # Preflight: fallisce subito e in chiaro se il daemon non è raggiungibile.
      - name: Check Docker daemon
        run: docker version

      # ghcr.io accetta solo path minuscoli, la variabile può non esserlo.
      - name: Resolve image and tag
        run: |
          echo "IMAGE=ghcr.io/$(echo "${{ vars.GHCR_USERNAME }}" | tr '[:upper:]' '[:lower:]')/matches-api" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ vars.GHCR_USERNAME }}" --password-stdin

      # buildx (non `docker build`): il Dockerfile usa `# syntax=` e BuildKit
      # legge docker/production/Dockerfile.dockerignore per filtrare il context.
      # Il context è la ROOT del repo (serve composer.json).
      - name: Build and push
        run: |
          docker buildx build \
            -f docker/production/Dockerfile \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$SHORT_SHA" \
            --push \
            .

      - name: Logout
        if: always()
        run: docker logout ghcr.io

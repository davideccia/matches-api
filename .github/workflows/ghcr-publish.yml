name: GHCR publish

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  # Gate: l'immagine non viene costruita se la suite non passa.
  # Nessun servizio esterno: la configurazione arriva da .env.testing
  # (versionato) copiato in .env, e il database e' SQLite su file.
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Estensioni richieste da composer.json: zip, pcntl (horizon),
      # exif (medialibrary), gd (usata da UploadedFile::fake()->image()
      # nei test). pdo_sqlite/sqlite3 sono già incluse dall'action.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: zip, pcntl, exif, gd
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Security audit
        run: composer audit --no-dev

      - name: Prepare environment
        run: |
          cp .env.testing .env
          touch database/testing.sqlite

      - name: Run tests
        run: php artisan test --compact

  build-push:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # VERSION: tag della release (es. v1.2.3), normalizzato ai caratteri
      # ammessi in un tag Docker ([A-Za-z0-9_.-], max 128). Fallback: titolo
      # della release, poi il ref (per gli avvii manuali senza release).
      # `github.repository` è già in lowercase, a differenza di GHCR_USERNAME
      # su Forgejo che poteva non esserlo.
      - name: Resolve version
        run: |
          RAW="${{ github.event.release.tag_name || github.event.release.name || github.ref_name }}"
          VERSION=$(echo "$RAW" | sed 's/[^A-Za-z0-9_.-]/-/g' | cut -c1-128)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Il Dockerfile usa `# syntax=` e BuildKit legge
      # docker/production/Dockerfile.dockerignore per filtrare il context.
      # Il context è la ROOT del repo (serve composer.json).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}
